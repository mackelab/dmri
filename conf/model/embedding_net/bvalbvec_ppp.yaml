name: DMRIEmbeddingConfig
params:
  num_layers: 3
  num_heads: 8
  widening_factor: 4
  use_flash_attention: True
  attn_size: 16
  dropout_rate: 0.0
  bvals_embed_dim: 12
  signals_embed_dim: 12
  bvec_repeats: 4
  min_bval: 0.0

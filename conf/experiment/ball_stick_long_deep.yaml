# @package _global_
name: dmri_ball_sticks_long_deep_train_real
use_wandb: true

hydra:
  sweeper:
    params:
      wandb.project: dmri_ball_sticks
      model.model_dim: 128
      model.inference_net.params.num_layers: 10
      train.optimizer.scheduler_params.transition_steps: 500_000


defaults:

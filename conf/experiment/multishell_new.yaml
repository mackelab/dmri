# @package _global_
name: multishell_new
use_wandb: true

hydra:
  sweeper:
    params:
      wandb.project: multishell_new
      train.ema_decay: 0.9999
      train.dataloader.train_params.batch_size: 2048
      train.dataloader.train_params.num_producers: 2
      model.embedding_net.params.use_flash_attention: false


defaults:
  - _self_
  - override /partition: h100
  - override /simulator: multishell_ball3stick_shared_with_score
  - override /simulator/acquisition_scheme: multi
  - override /model: mask_amortized_pp_v_pred
  - override /model/inference_net: simformer6

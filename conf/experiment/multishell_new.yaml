# @package _global_
name: multishell_new
use_wandb: true

hydra:
  sweeper:
    params:
      wandb.project: new_multishell_ball3stick
      train.ema_decay: 0.9999
      train.dataloader.train_params.num_producers: 4


defaults:
  - _self_
  - override /partition: h100_long
  - override /simulator: multishell_ball3stick_shared_with_score
  - override /simulator/acquisition_scheme: multi
  - override /model: mask_amortized_pp_v_pred
  - override /model/inference_net: simformer6

    params:
      wandb.project: dmri_all_gaussian
      model.model_dim: 128
      model.inference_net.params.num_layers: 8
      model.model_selection_net.params.num_layers: 6
      train.dataloader.val_params.batch_size: 128



defaults:
  - _self_
  - override /partition: h100
  - override /simulator: all_gaussian
  - override /train/optimizer: default_new_restarts

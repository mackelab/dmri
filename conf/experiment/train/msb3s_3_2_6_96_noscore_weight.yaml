# @package _global_

hydra:
  sweeper:
    params:
      training.continue_training: true
      model.model_dim: 96
      model.embedding_net.params.num_layers: 3
      model.inference_net.params.num_layers: 6
      model.model_selection_net.params.num_layers: 2
      training.dataloader.train_loader.batch_size: 2048
      training.weight_by_complexity: true
      tracking.wandb.project: msb3s1
defaults:
- _self_
- override /infrastructure/partition: h100_long
- override /simulator: multishell_ball3stick_shared
- override /simulator/acquisition_scheme: multi
- override /model: dmri
run:
  name: msb3s_3_2_6_96_noscore_weight
tracking:
  enabled: true

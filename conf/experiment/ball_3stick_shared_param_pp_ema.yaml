# @package _global_
name: dmri_ball_sticks_new_pp_ema
use_wandb: true

hydra:
  sweeper:
    params:
      wandb.project: dmri_ball_sticks_shared_param
      model.model_dim: 128
      train.optimizer.scheduler_params.transition_steps: 1_000_000
      model.embedding_net.params.log_transform_signals: False
      train.eval_freq: 100_000


defaults:
  - _self_
  - override /partition: h100
  - override /simulator: ball3stick_shared
  - override /model: mask_amortized_pp
  - override /train/optimizer: default_new_ema

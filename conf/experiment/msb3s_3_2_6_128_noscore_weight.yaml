# @package _global_
name: msb3s_3_2_6_128_noscore_weight
use_wandb: true

hydra:
  sweeper:
    params:
      wandb.project: msb3s
      train.continue_training: true
      model.embedding_net.params.num_layers: 3
      model.inference_net.params.num_layers: 6
      model.model_selection_net.params.num_layers: 2
      train.dataloader.train_loader.batch_size: 2048
      train.weight_by_complexity: true

defaults:
  - _self_
  - override /partition: h100_long
  - override /simulator: multishell_ball3stick_shared
  - override /simulator/acquisition_scheme: multi
  - override /model: dmri

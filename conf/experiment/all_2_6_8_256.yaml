# @package _global_
name: all_2_6_8_256
use_wandb: true

hydra:
  sweeper:
    params:
      wandb.project: all
      train.continue_training: true
      model.model_dim: 256
      model.embedding_net.params.num_layers: 2
      model.inference_net.params.num_layers: 8
      model.model_selection_net.params.num_layers: 6

defaults:
  - _self_
  - override /partition: h100_long
  - override /simulator: all_gaussian
  - override /simulator/acquisition_scheme: multi
  - override /model: dmri

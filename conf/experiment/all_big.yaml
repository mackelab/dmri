# @package _global_
name: all_big
use_wandb: true

hydra:
  sweeper:
    params:
      wandb.project: all_models
      train.ema_decay: 0.9999
      train.dataloader.val_loader.batch_size: 64
      model.model_dim: 256
      train.continue_training: true


defaults:
  - _self_
  - override /partition: h100_long
  - override /simulator: all_models
  - override /train/dataloader: datastream_large_batch_small_sim
  #- override /simulator/acquisition_scheme: multi
  - override /model: mask_amortized_pp_global_ctx

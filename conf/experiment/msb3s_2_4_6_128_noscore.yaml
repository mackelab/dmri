# @package _global_
name: msb3s_2_4_6_128_noscore
use_wandb: true

hydra:
  sweeper:
    params:
      wandb.project: msb3s
      train.continue_training: true
      model.embedding_net.params.num_layers: 2
      model.inference_net.params.num_layers: 6
      model.model_selection_net.params.num_layers: 4

defaults:
  - _self_
  - override /partition: h100_long
  - override /simulator: multishell_ball3stick_shared
  - override /simulator/acquisition_scheme: multi
  - override /model: dmri

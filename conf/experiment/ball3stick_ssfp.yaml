# @package _global_
name: ball3stick_ssfp_fixed
use_wandb: true

hydra:
  sweeper:
    params:
      wandb.project: ball3stick_ssfp
      train.continue_training: true
      train.ema_decay: 0.9999


defaults:
  - _self_
  - override /partition: h100
  - override /simulator: ball3stick_ssfp
  - override /model: ssfp_mask_amortized_pp
  - override /model/inference_net: simformer6

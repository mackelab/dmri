# @package _global_
hydra:
  mode: MULTIRUN
  sweeper:
    params:
      name: dmri_bigger_dropout
      use_wandb: true
      model.model_dim: 128
      model.embedding_net.params.dropout_rate: 0.1
      model.inference_net.params.dropout_rate: 0.1
      model.model_selection_net.params.dropout_rate: 0.1

defaults:
  - _self_
  - override /partition: h100

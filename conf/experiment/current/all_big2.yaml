# @package _global_
name: all_big2
use_wandb: true

hydra:
  sweeper:
    params:
      wandb.project: all_models
      train.ema_decay: 0.9999
      train.continue_training: true
      train.optimizer.gradient_clip_value: 1.0
      model.model_dim: 256
      model.inference_net.params.gate_attention: false


defaults:
  - _self_
  - override /partition: h100_long
  - override /simulator: all_gaussian
  - override /train/dataloader: datastream
 # - override /simulator/acquisition_scheme: multi
  - override /model: mask_amortized_pp_global_ctx2
  - override /model/embedding_net: bvalbvec_pp

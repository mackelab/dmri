# @package _global_
name: default_pp_global_ctx9_3
use_wandb: true

hydra:
  sweeper:
    params:
      wandb.project: new_multishell_ball3stick
      train.ema_decay: 0.9999
      train.continue_training: true
      model.inference_net.params.gate_attention: false
      model.inference_net.params.precision: BF16_BF16_F32
      model.inference_net.params.dtype: bfloat16
      model.inference_net.params.preferred_element_type: float32
      model.embedding_net.params.precision: BF16_BF16_F32
      model.embedding_net.params.dtype: bfloat16
      model.embedding_net.params.preferred_element_type: float32
      model.model_selection_net.params.precision: BF16_BF16_F32
      model.model_selection_net.params.dtype: bfloat16
      model.model_selection_net.params.preferred_element_type: float32
      model.embedding_net.params.y_seq_dim: 8

defaults:
  - _self_
  - override /partition: h100_long
  - override /model/embedding_net: bvalbvec_pp
  - override /simulator: multishell_ball3stick_shared_with_score
  - override /simulator/acquisition_scheme: multi
  - override /model: mask_amortized_pp_global_ctx2

# @package _global_
name: finalize_ball3stick
use_wandb: true

hydra:
  sweeper:
    params:
      wandb.project: finalize_ball3stick
      simulator.prior_mask_alpha: 3. # Emphasize larger models
      simulator.acquisition_scheme.params.typical_prob: 1.0
      simulator.acquisition_scheme.params.random_prob: 0.0


defaults:
  - _self_
  - override /partition: h100
  - override /simulator: ball3stick_shared_with_score
  - override /model: mask_amortized_pp

# Sliced Wasserstein Distance metric against a reference theta sample set.
key: swd
type: sliced_wasserstein
output_filename: metric_swd.nii.gz
sample_reduction: none
sample_axis: null
requires_theta_samples: true
write_summary: true
summary_filename: swd_summary.json
options:
  # Path to a .npz/.npy file containing reference theta samples. Must be
  # overridden per experiment, otherwise the metric is skipped.
  reference_samples_path: null
  num_directions: 128
  random_seed: 0
aggregations:
  - type: mean
    name: mean
  - type: std
    name: std
  - type: percentile
    q: [5, 50, 95]
    name: p{q}

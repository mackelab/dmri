# Calibration error for model-selection probabilities
key: model_selection_calibration
type: model_selection_calibration
output_filename: metric_model_selection_calibration_error.nii.gz
batch_size: 20000
sample_reduction: none
sample_axis: 1
requires_theta_samples: false
write_summary: true
summary_filename: model_selection_calibration_summary.json
options:
  num_bins: 10
  reliability_output_filename: model_selection_reliability.json
aggregations:
  - type: mean
    name: ece
  - type: max
    name: mce

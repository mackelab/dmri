[tool.poetry]
name = "dmri"
version = "0.1.0"
description = "A project for selecting models for diffusion MRI."
authors = ["Your Name <your.email@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
hydra-core = "^1.3"
hydra-submitit-launcher = "*"
hydra-optuna-sweeper = "*"
wandb = "*"
jax = "*"
jaxlib = "*"
numpy = "*"
scipy = "*"
matplotlib = "^3.7.0"
tqdm = "^4.65.0"
dipy = "^1.7.0"
nibabel = "^5.1.0"
pandas = "^2.0.0"
probjax = {git = "https://github.com/mackelab/probjax.git"}

[tool.poetry.group.dev.dependencies]
pytest = "^7.3.1"
pytest-cov = "^4.1.0"
ruff = "^0.0.280"
black = "^23.7.0"
isort = "^5.12.0"
mypy = "^1.4.1"
pre-commit = "^3.3.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
dmri = "dmri.train.hydra_script:main"

[tool.black]
line-length = 88
target-version = ["py39"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
select = ["E", "F", "B", "I", "W", "C4", "N", "UP"]
ignore = ["E501"]
target-version = "py39"
fix = true

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "dmri"
version = "0.1.0"
description = "A project for selecting models for diffusion MRI."
authors = [
  { name = "Manuel Gloeckler", email = "manuel.gloeckler@uni-tuebingen.de" }
]
license = "MIT"
requires-python = ">=3.10,<=3.12.11"
dependencies = [
    "hydra-core>=1.3",
    "hydra-submitit-launcher",
    "hydra-optuna-sweeper",
    "jupyter",
    "wandb",
    "jax == 0.5.3",
    "scipy",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "dipy>=1.7.0",
    "nibabel>=5.1.0",
    "pandas>=2.0.0",
    "probjax @ git+https://github.com/mackelab/probjax.git",
    "orbax",
    "blackjax",
    "plotly",
    "optax",
    "absl-py"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.1,<8.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "ruff>=0.0.280,<1.0.0",
    "black>=23.7.0,<24.0.0",
    "isort>=5.12.0,<6.0.0",
    "mypy>=1.4.1,<2.0.0",
    "pre-commit>=3.3.3,<4.0.0"
]
cuda = [
    "jax[cuda12] == 0.5.3"
]
notebook = [
    "torch @ https://download.pytorch.org/whl/cpu/torch-2.5.1%2Bcpu-cp310-cp310-linux_x86_64.whl#sha256=7f91a2200e352745d70e22396bd501448e28350fbdbd8d8b1c83037e25451150",
    "sbi",
]


[project.scripts]
dmri = "dmri.train.hydra_script:main"
dmri_eval = "dmri.eval.hydra_script_eval:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ["py39"]
include = '\\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
select = ["E", "F", "B", "I", "W", "C4", "N", "UP"]
ignore = ["E501"]
target-version = "py39"
fix = true

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["dmri*"]

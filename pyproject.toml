[project]
name = "dmri"
version = "0.1.0"
description = "A project for selecting models for diffusion MRI."
readme = "README.md"
authors = [
  { name = "Manuel Gloeckler", email = "manuel.gloeckler@uni-tuebingen.de" }
]
license = "MIT"
requires-python = ">=3.11"
keywords = [
    "diffusion MRI",
    "JAX",
    "model selection",
    "simulation-based inference",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "hydra-core>=1.3",
    "hydra-submitit-launcher>=1.2",
    "hydra-optuna-sweeper>=1.2",
    "jupyter>=1.1",
    "wandb>=0.23",
    "matplotlib>=3.7.0",
    "rich>=13.7",
    "dipy>=1.7.0",
    "nibabel>=5.1.0",
    "pandas>=2.0.0",
    "probjax @ git+https://github.com/mackelab/probjax.git",
    "orbax-checkpoint>=0.11",
    "plotly>=6.4",
    "prompt-toolkit>=3.0",
    "optax>=0.2",
    "absl-py>=2.3",
    "huggingface-hub>=0.34",
    # probjax and dmri.utils.shm use APIs removed in jax 0.9. Supported Linux
    # platforms get JAX's bundled CUDA 13 runtime; other platforms stay CPU-only.
    "jax[cuda13]>=0.8,<0.9; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "jax[cuda13]>=0.8,<0.9; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "jax>=0.8,<0.9; sys_platform != 'linux' or (platform_machine != 'x86_64' and platform_machine != 'aarch64')"
]

[project.urls]
Homepage = "https://www.mackelab.org/dmri/"
Documentation = "https://www.mackelab.org/dmri/"
Repository = "https://github.com/mackelab/dmri"
Issues = "https://github.com/mackelab/dmri/issues"
Changelog = "https://github.com/mackelab/dmri/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.3.1,<8.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "ruff>=0.0.280,<1.0.0",
    "mypy>=1.4.1,<2.0.0",
    "pre-commit>=3.3.3,<4.0.0"
]
docs = [
    "zensical>=0.0.51,<0.1",
    "mkdocstrings-python>=1.10.0",
    "nbconvert>=7.16.0"
]


[project.scripts]
dmri = "dmri.cli:main"
dmri_eval = "dmri.eval.eval_script:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
lint.select = ["E", "F", "B", "I", "W", "C4", "N", "UP"]
lint.ignore = ["E501", "N806", "C408", "N803","N802"]
target-version = "py311"
fix = true

[tool.ruff.format]
docstring-code-format = true
preview = true

[tool.ruff.lint.isort]
known-first-party = ["dmri"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["dmri*", "conf*"]

[tool.setuptools.package-data]
"conf" = ["**/*.yaml"]
"dmri.simulators" = ["data/*"]
"dmri.utils" = ["*.mplstyle"]

[project]
name = "dmri"
version = "0.1.0"
description = "A project for selecting models for diffusion MRI."
authors = [
  { name = "Manuel Gloeckler", email = "manuel.gloeckler@uni-tuebingen.de" }
]
license = "MIT"
requires-python = ">=3.10,<=3.12.11"
dependencies = [
    "hydra-core>=1.3",
    "hydra-submitit-launcher",
    "hydra-optuna-sweeper",
    "jupyter",
    "wandb",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "dipy>=1.7.0",
    "nibabel>=5.1.0",
    "pandas>=2.0.0",
    "probjax @ git+https://github.com/mackelab/probjax.git",
    "orbax-checkpoint==0.11.2",
    "plotly",
    "optax",
    "absl-py"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.1,<8.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "ruff>=0.0.280,<1.0.0",
    "mypy>=1.4.1,<2.0.0",
    "pre-commit>=3.3.3,<4.0.0"
]
cuda = [
    "jax[cuda12] == 0.5.3"
]


[project.scripts]
dmri = "dmri.train.hydra_script:main"
dmri_eval = "dmri.eval.hydra_script_eval:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
lint.select = ["E", "F", "B", "I", "W", "C4", "N", "UP"]
lint.ignore = ["E501", "N806", "C408", "N803","N802"]
target-version = "py39"
fix = true

[tool.ruff.format]
docstring-code-format = true
preview = true

[tool.ruff.lint.isort]
known-first-party = ["dmri"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["dmri*", "conf*", "conf_eval*"]

[tool.setuptools.package-data]
"conf" = ["*"]
"conf_eval" = ["*"]

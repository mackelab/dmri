name: Docs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 🔑 Use the same PAT secret you use in CI so pip can clone probjax
      - name: Configure git for private GitHub repo access
        env:
          PROBJAX_PAT: ${{ secrets.PROBJAX_READ_TOKEN }}
        run: |
          if [ -z "$PROBJAX_PAT" ]; then
            echo "PROBJAX_READ_TOKEN is empty or not set"
            exit 1
          fi

          # Use PAT for all https://github.com/... URLs
          git config --global url."https://github:${PROBJAX_PAT}@github.com/".insteadOf "https://github.com/"

          # (Optional while debugging)
          # git ls-remote https://github.com/mackelab/probjax.git
        shell: bash

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build MkDocs site
        run: |
          mkdocs build

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

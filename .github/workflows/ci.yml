name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    # 🔑 Use PAT so pip can clone mackelab/probjax
    - name: Configure git for private GitHub repo access
      run: |
        git config --global url."https://x-access-token:${{ secrets.PROBJAX_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"
        # Optional debug:
        # git ls-remote https://github.com/mackelab/probjax.git
      shell: bash

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests
      run: |
        pytest tests/ --cov=dmri --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}  # if needed

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # Only needed here if linting also installs dmri (and thus probjax)
    - name: Configure git for private GitHub repo access
      run: |
        git config --global url."https://x-access-token:${{ secrets.PROBJAX_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"
      shell: bash

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install ruff mypy

    - name: Check formatting with Ruff
      run: |
        ruff format --check .

    - name: Lint with Ruff
      run: |
        ruff check .

    - name: Type check with mypy
      run: |
        mypy dmri

[project]
site_name = "DMRI"
site_description = "Diffusion MRI simulation, model selection, and parameter inference"
site_author = "Macke Lab"
copyright = "Copyright &copy; 2026 Macke Lab"
site_url = "https://www.mackelab.org/dmri/"
docs_dir = "docs"
site_dir = "site"
repo_name = "mackelab/dmri"
repo_url = "https://github.com/mackelab/dmri"
extra_javascript = [
  "javascripts/mathjax.js",
  "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js",
]
extra_css = ["stylesheets/api.css"]
nav = [
  { "Home" = "index.md" },
  { "Get started" = "getting-started.md" },
  { "Guides" = [
    { "Overview" = "guides/index.md" },
    { "Predict" = "guides/prediction.md" },
    { "Train" = "guides/training.md" },
    { "Evaluate" = "guides/evaluation.md" },
    { "Simulators" = "guides/simulators.md" },
  ] },
  { "CLI" = [
    { "Predict" = "cli/predict.md" },
    { "Train" = "cli/train.md" },
    { "Eval" = "cli/eval.md" },
  ] },
  { "Python API" = [
    { "Predict" = "reference/hub.md" },
    { "Train" = "reference/train.md" },
    { "Eval" = "reference/eval.md" },
    { "Simulators" = "reference/simulators.md" },
    { "Neural networks" = "reference/nn.md" },
    { "Utilities" = "reference/utils.md" },
  ] },
  { "Examples" = [
    { "Overview" = "examples/index.md" },
    { "Simulator components" = "examples/01_dmri_simulator_components.md" },
    { "Multi-compartment model" = "examples/02_dmri_multicompartment_model.md" },
    { "Using pretrained models" = "examples/03_pretrained_models.md" },
    { "Train a small model" = "examples/04_train_standalone.md" },
    { "Getting example data" = "examples/05_example_data.md" },
  ] },
  { "Reference" = [
    { "Overview" = "reference/index.md" },
    { "Configuration" = "reference/configuration.md" },
    { "Outputs" = "reference/outputs.md" },
    { "Troubleshooting" = "reference/troubleshooting.md" },
    { "Development" = "development.md" },
  ] },
]

[project.theme]
variant = "modern"
logo = "assets/logo.svg"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.font]
text = "Source Sans Pro"
code = "Fira Code"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_root_heading = true
show_root_full_path = false
show_if_no_docstring = true
separate_signature = true
merge_init_into_class = true
signature_crossrefs = true
show_source = false
show_signature_annotations = true
annotations_path = "brief"
docstring_section_style = "table"
members_order = "source"
show_symbol_type_heading = true
show_symbol_type_toc = true

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
toc_depth = 3
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
smart_enable = "all"
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.superfences]

# Kernel Stein Discrepancy (multi-scale, preconditioned) per voxel.
key: ksd
type: ksd
output_filename: metric_ksd.nii.gz
batch_size: 10_000
sample_reduction: none
sample_axis: 1
requires_theta_samples: true
write_summary: true
summary_filename: ksd_summary.json
options:
  # Bandwidths (in preconditioned space) used for the multi-scale KSD kernel.
  bandwidths: [0.001,0.05, 0.1, 0.5, 1.0, 3.]
  # Number of wild-bootstrap replicates for the test statistic.
  n_bootstrap: 256
  # If a probabilistic model mask is present, threshold it to a deterministic mask.
  mask_threshold: 0.5
  # Limit the number of theta samples per voxel (set to null to keep all).
  max_samples: null
  # Random seed for bootstrap / bandwidth sampling.
  random_seed: 0
  # Export a p-value map alongside the KSD statistic.
  export_pvalue: true
  pvalue_output_filename: metric_ksd_pvalue.nii.gz
aggregations:
  - type: mean
    name: mean
  - type: median
    name: median
  - type: percentile
    q: [5, 95]
    name: p{q}

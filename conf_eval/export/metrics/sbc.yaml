key: sbc_marginal_coverage
type: sbc_marginal_coverage
output_filename: metric_sbc_marginal_coverage.nii.gz
batch_size: 20000
sample_reduction: none
sample_axis: 1
requires_theta_samples: true
write_summary: true
summary_filename: sbc_marginal_coverage_summary.json
aggregations:
  - type: mean
    name: mean
  - type: median
    name: median
  - type: percentile
    q: [5, 95]
    name: p{q}

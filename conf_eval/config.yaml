# Evaluation configuration

defaults:
  - _self_
  - data: file
  - mask_sample: default
  - theta_sample: default
  - model_selection: none
  - export: ball3stick
  - export_model_selection: ball3stick

# Loading model
results_root: ${hydra:runtime.cwd}/results
results_folder: null
path_checkpoint: null
model_name: "dmri"
params_name: "params_ema"

# Sampling configs
seed: 1
sample_mask: true
sample_theta: true
select_models: true
default_mask: null
use_true_model_mask_for_synthetic: false

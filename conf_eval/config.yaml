# Evaluation configuration

defaults:
  - _self_
  - data: file
  - mask_sample: default
  - theta_sample: default
  - model_selection: none
  - export: ball3stick
  - export_model_selection: ball3stick

# Loading model
results_root: ${hydra:runtime.cwd}/results
results_folder: null
path_checkpoint: null
model_name: "dmri"
params_name: "params_ema"
checkpoint: "latest"

# Optional pretrained model source and artifact destination.
pretrained_repo_id: null
pretrained_revision: null
pretrained_cache_dir: null
local_files_only: false
output_dir: null
reuse_theta_samples: false

# Batching. Leave the per-stage `eval_batch_size` values null to have the largest
# workable batch determined from the device; set this to pin an exact value.
batch_size: null

# Numeric precision for the network forward pass: fp32, bf16, or fp16.
# Parameters, the sampler and the export always stay float32.
precision: fp32

# Sampling configs
seed: 1
sample_mask: true
sample_theta: true
select_models: true
default_mask: null
use_true_model_mask_for_synthetic: false

# Synthetic evaluation data generated from the checkpoint simulator
source: synthetic
use_true_model_mask_for_synthetic: true
clip_outliers: false
num_voxels: 4096
# Fixed mask-prior hyperparameter (e.g., u for TotalParamPenalizedPrior or p for BetaBernoulli)
model_mask_hyperparameter: 0.25
# Optional: configure synthetic acquisition using simulator configs (e.g. hcp, hardi)
acquisition_scheme: hcp
# List of b-values (one per gradient direction)
bvals: [0, 1000, 2000, 3000]
# If omitted, random unit b-vectors are generated for each b-value entry.
bvecs: null
# RNG seed for synthetic generation (defaults to cfg.seed when null)
seed: null

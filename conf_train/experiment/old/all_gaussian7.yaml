# @package _global_
name: dmri_all_gaussian_more_layers2
use_wandb: true

hydra:
  sweeper:
    params:
      wandb.project: dmri_all_gaussian
      model.model_dim: 128
      model.inference_net.params.num_layers: 8
      model.model_selection_net.params.num_layers: 6
      train.dataloader.val_loader.batch_size: 128
      train.optimizer.scheduler_params.transition_steps: 500_000
      train.optimizer.ema_decay: 0.99




defaults:
  - _self_
  - override /partition: h100
  - override /simulator: all_gaussian
  - override /train/optimizer: default_new_ema

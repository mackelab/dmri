# @package _global_
name: all_3_6_8_128_model_prior_with_convs
use_wandb: true

hydra:
  sweeper:
    params:
      wandb.project: all_conv
      train.continue_training: true
      model.embedding_net.params.num_layers: 3
      model.inference_net.params.num_layers: 8
      model.model_selection_net.params.num_layers: 6

defaults:
  - _self_
  - override /partition: h100_long
  - override /simulator: all_models
  - override /train/dataloader: datastream_gpu
  - override /simulator/acquisition_scheme: hcp
  - override /model: dmri

# @package _global_
name: b3s_2_4_6_128_score_mixed_precision
use_wandb: true

hydra:
  sweeper:
    params:
      wandb.project: b3s
      train.continue_training: true
      model.model_dim: 128
      model.embedding_net.params.num_layers: 2
      model.inference_net.params.num_layers: 6
      model.model_selection_net.params.num_layers: 4
      model.dtype: bfloat16
      model.preferred_element_type: float32
      model.precision: BF16_BF16_F32
      train.ema_decay: 0.9999

defaults:
  - _self_
  - override /partition: h100_long
  - override /simulator: ball3stick_shared_with_score
  - override /simulator/acquisition_scheme: multi
  - override /model: dmri

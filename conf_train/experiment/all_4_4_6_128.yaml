# @package _global_
name: all_4_4_6_128
use_wandb: true

hydra:
  sweeper:
    params:
      wandb.project: all
      train.continue_training: true
      model.embedding_net.params.num_layers: 4
      model.inference_net.params.num_layers: 6
      model.model_selection_net.params.num_layers: 4
      train.dataloader.train_loader.batch_size: 2048

defaults:
  - _self_
  - override /partition: h100_long
  - override /simulator: all_gaussian
  - override /simulator/acquisition_scheme: multi
  - override /model: dmri
